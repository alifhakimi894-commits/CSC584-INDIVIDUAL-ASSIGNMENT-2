<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UiTM Profile Registration</title>
<link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="form-container">

    <div class="form-header">
        <div class="person-icon">🎓</div>
        <h2>UiTM Profile Registration</h2>
        <p>Fill in your details to create your student profile</p>
    </div>

    <div class="top-nav">
        <a href="ProfileServlet?action=list" class="nav-link">📋 View All Profiles</a>
    </div>

    <form action="ProfileServlet" method="POST">
        <input type="hidden" name="action" value="insert">

        <div class="form-group">
            <label>Student ID</label>
            <input type="text" name="studentID" placeholder="2024xxxxxx" required>
        </div>

        <div class="form-group">
            <label>Full Name</label>
            <input type="text" name="name" placeholder="Enter full name" required>
        </div>

        <div class="form-group">
            <label>Programme</label>
            <input type="text" name="programme" placeholder="e.g. Bachelor of Computer Science" required>
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" placeholder="name@uitm.edu.my" required>
        </div>

        <div class="form-group">
            <label>Hobbies</label>
            <input type="text" name="hobbies" placeholder="Gaming, Reading, etc." required>
        </div>

        <div class="form-group">
            <label>Introduction</label>
            <textarea name="introduction" placeholder="Write something about yourself..." required></textarea>
        </div>

        <button type="submit" class="btn-submit">
            Save Profile
        </button>

    </form>

</div>

</body>
</html>
